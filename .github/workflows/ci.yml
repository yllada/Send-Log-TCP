# =============================================================================
# CI Pipeline - Tests, Linting, and Code Quality
# =============================================================================
# This workflow runs on every push and pull request to ensure code quality.
#
# Jobs:
#   - test: Run Go unit tests with coverage
#   - lint: Run golangci-lint for code quality
#   - build: Build the sendlog binary (TUI + CLI subcommands) for Linux (amd64)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'

jobs:
  # ===========================================================================
  # Job: Go Tests
  # ===========================================================================
  test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev pkg-config

      - name: Run tests
        run: CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Optional: Fail if coverage is below threshold
          # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          #   echo "Coverage is below 50%"
          #   exit 1
          # fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Job: Go Linting
  # ===========================================================================
  lint:
    name: Go Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev pkg-config

      - name: Build GTK4 GUI
        run: CGO_ENABLED=1 go build ./internal/gui/

      # Pinned to an explicit golangci-lint v2 release. "latest" resolves to
      # the newest v1 release, which is built with Go 1.24 and refuses to run
      # against the go 1.25.0 directive in go.mod.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ===========================================================================
  # Job: Build sendlog (linux/amd64)
  # ===========================================================================
  # sendlog is a single static binary: the Bubble Tea TUI when run bare, and
  # the send/connect/stress CLI subcommands for automation. It has no
  # webview/frontend dependency, so it builds without CGO.
  build:
    name: Build sendlog (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -o sendlog-linux-amd64 \
            -ldflags "-s -w -X Sendlog-Syslog/internal/cli.Version=$(git describe --tags --always 2>/dev/null || echo dev)" \
            ./cmd/sendlog
          ./sendlog-linux-amd64 version
          ./sendlog-linux-amd64 help > /dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sendlog-linux-amd64
          path: sendlog-linux-amd64
