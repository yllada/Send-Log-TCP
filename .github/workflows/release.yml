# =============================================================================
# Release Pipeline - Builds the sendlog binary for multiple platforms
# =============================================================================
# Runs when a version tag is pushed (v*).
# Builds a static, dependency-free binary for Windows, Linux and macOS and
# publishes it as a GitHub Release with an auto-generated changelog.
#
# Usage:
#   git tag v1.9.0
#   git push origin v1.9.0
#
# Conventional Commits power the changelog:
#   feat: nueva funcionalidad
#   fix: corrección de bug
#   docs: documentación
#   perf: mejora de rendimiento
#   refactor: refactorización
#   chore: mantenimiento
#
# Documentation:
#   - GitHub Releases: https://docs.github.com/en/repositories/releasing-projects-on-github
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v1.0.0-beta.1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.4.0)'
        required: true
        type: string

# Permissions needed to create releases
permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  APP_NAME: 'sendlog'

jobs:
  # ===========================================================================
  # Job: Prepare Release
  # ===========================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_short: ${{ steps.version.outputs.version_short }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for the changelog

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_short=${VERSION#v}" >> $GITHUB_OUTPUT

          # Detect prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "📦 Version: ${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges HEAD)
          else
            echo "Previous tag: ${PREVIOUS_TAG}"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREVIOUS_TAG}..HEAD)
          fi

          # Categorize commits by type (Conventional Commits)
          FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" || true)
          PERF=$(echo "$COMMITS" | grep -E "^- perf" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- docs" || true)
          REFACTOR=$(echo "$COMMITS" | grep -E "^- refactor" || true)
          CHORE=$(echo "$COMMITS" | grep -E "^- chore" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix|perf|docs|refactor|chore)" || true)

          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### ✨ New Features\n${FEATURES}\n\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi

          if [ -n "$PERF" ]; then
            CHANGELOG="${CHANGELOG}### ⚡ Performance\n${PERF}\n\n"
          fi

          if [ -n "$REFACTOR" ]; then
            CHANGELOG="${CHANGELOG}### ♻️ Refactoring\n${REFACTOR}\n\n"
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### 📚 Documentation\n${DOCS}\n\n"
          fi

          if [ -n "$CHORE" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 Maintenance\n${CHORE}\n\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### 📝 Other Changes\n${OTHER}\n\n"
          fi

          # If there are no categorized commits, list them all
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="### 📝 Changes\n${COMMITS}\n"
          fi

          # Store the changelog (escaped for multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "=== CHANGELOG GENERATED ==="
          echo -e "$CHANGELOG"

  # ===========================================================================
  # Job: Build sendlog for all platforms (static, no CGO)
  # ===========================================================================
  build:
    name: Build sendlog
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            bin_suffix: .exe
          - goos: linux
            goarch: amd64
            bin_suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X Sendlog-Syslog/internal/cli.Version=${VERSION}" \
            -o bin/${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.bin_suffix }} \
            ./cmd/sendlog
          chmod +x bin/${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.bin_suffix }} 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*
          if-no-files-found: error

  # ===========================================================================
  # Job: Build Linux .deb with the GTK4 GUI
  # ===========================================================================
  deb:
    name: Build sendlog .deb
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev pkg-config dpkg-dev

      - name: Build GUI binary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X Sendlog-Syslog/internal/cli.Version=${VERSION}" \
            -o sendlog \
            ./cmd/sendlog
          ./sendlog version

      - name: Package .deb
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VER_NUM="${VERSION#v}"
          ARCH="amd64"
          PKG="sendlog"
          STAGE="deb-build/${PKG}_${VER_NUM}_${ARCH}"

          # Derive the real GTK4 runtime packages from the binary's shared
          # library dependencies so the control file always matches the build.
          DEPS=$(objdump -p sendlog | awk '/NEEDED/{print $2}' \
            | grep -E '^lib(gtk-4|adwaita-1|glib-2|gobject-2|gio-2|gdk_pixbuf|pango|cairo|gmodule)' \
            | sort -u \
            | while read -r lib; do
                dpkg -S "/usr/lib/x86_64-linux-gnu/${lib}" 2>/dev/null \
                  | head -1 | cut -d: -f1
              done | grep -v -- '-dev$' | sort -u | paste -sd, - | sed 's/,/, /g')
          echo "Depends: ${DEPS}"

          mkdir -p \
            "${STAGE}/DEBIAN" \
            "${STAGE}/usr/bin" \
            "${STAGE}/usr/share/applications"
          cp sendlog "${STAGE}/usr/bin/sendlog"
          cp assets/com.sendlog.gui.desktop "${STAGE}/usr/share/applications/com.sendlog.gui.desktop"
          cp -r assets/icons/. "${STAGE}/usr/share/icons"

          printf '%s\n' \
            "Package: ${PKG}" \
            "Version: ${VER_NUM}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: ${ARCH}" \
            "Maintainer: SendLog <maintainers@sendlog.dev>" \
            "Description: Send syslog messages to a remote server" \
            " Send syslog messages (TCP/UDP, TLS, RFC 3164/5424, replay) with a" \
            " GTK4 desktop application, a terminal UI, and a CLI for automation." \
            "Homepage: https://github.com/${GITHUB_REPOSITORY#*/}" \
            "Depends: ${DEPS}" \
            > "${STAGE}/DEBIAN/control"
          cat "${STAGE}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${STAGE}"
          mv "${STAGE}.deb" "${PKG}_${VER_NUM}_${ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sendlog-linux-amd64-deb
          path: sendlog_*.deb
          if-no-files-found: error

  # ===========================================================================
  # Job: Create GitHub Release with all binaries
  # ===========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build, deb]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage release assets
        run: |
          mkdir -p release
          cp -r artifacts/* release/ 2>/dev/null || true
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          generate_release_notes: false
          body: |
            ## ${{ needs.prepare.outputs.version }}

            ${{ needs.prepare.outputs.changelog }}

            ### 📦 Binaries

            | Platform | File |
            |--------|------|
            | Windows (64-bit) | sendlog-windows-amd64.exe (icon embedded) |
            | Linux (64-bit, TUI/CLI) | sendlog-linux-amd64 |
            | Linux (64-bit, GUI .deb) | sendlog-*_amd64.deb |

            ### 🚀 Quick Start

            ```bash
            # Windows / Linux (static binary):
            ./sendlog                  # GUI on Linux with a display, TUI elsewhere
            ./sendlog send -a host -p 514 -m "hello"   # send a message
            ./sendlog help             # full flag reference

            # Linux (.deb installs the GUI app):
            dpkg -i sendlog-<version>_amd64.deb
            ```
